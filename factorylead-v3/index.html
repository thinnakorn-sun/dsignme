function setPage(page){state.page=page;state.menu=false;state.detail=null;state.selected.clear();if(page==='directory'){if(window.innerWidth<741)state.view='cards';state.filter='ทั้งหมด';state.q='';state.province='ทั้งหมด';state.type='ทั้งหมด';state.process='ทั้งหมด'}closeDetail();render();window.scrollTo({top:0,behavior:'instant'})}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2700)}
function showDetail(id){let f=factories.find(x=>x.id===id);if(!f)return;state.detail=id;document.getElementById('drawerbg').classList.add('show');let el=document.getElementById('detail');el.innerHTML=`<div class="detail-top"><div><div class="eyebrow">COMPANY INTELLIGENCE · ${esc(f.code)}</div><h2 style="font-size:19px;line-height:1.5;margin-top:6px">${esc(f.name)}</h2><p class="sub">${esc(f.en)} · ข้อมูลสมมติเพื่อทดลอง UX</p></div><button class="circlebtn" data-action="close-detail" aria-label="ปิดรายละเอียด">${icon('x')}</button></div><div class="detail-body detail-v2"><div class="detail-scorecard"><div><small>OPPORTUNITY FIT · DEMO</small><strong>${f.score}<span>/100</span></strong><p>คะแนนสมมติสำหรับทดสอบหน้าจอ ไม่ได้ประเมินโรงงานจริง</p></div><div class="score-ring" style="--score:${f.score}">${f.score}</div></div><div class="detail-label">ภาพรวมข้อมูลโรงงาน</div><div class="info-grid"><div><div class="infokey">อุตสาหกรรม</div><div class="infoval">${esc(f.type)}</div></div><div><div class="infokey">จังหวัด</div><div class="infoval">${esc(f.province)}</div></div><div><div class="infokey">พื้นที่</div><div class="infoval">${esc(f.area)}</div></div><div><div class="infokey">อัปเดตตัวอย่าง</div><div class="infoval">${esc(f.updated)}</div></div></div><div class="detail-label">Business signal</div><div class="signal-highlight">${badge(f.signal)}<p>${f.signal==='ขยายกิจการ'?'แสดงตัวอย่างเหตุการณ์ขยายกิจการ เพื่อใช้ประเมินความเหมาะสมของลูกค้าเป้าหมาย':f.signal==='เปิดใหม่'?'แสดงตัวอย่างเหตุการณ์เปิดโรงงานใหม่ เพื่อตรวจสอบความสนใจในสินค้าและบริการ':'ไม่มีสัญญาณใหม่ในระเบียนจำลองนี้'}</p><small>สัญญาณไม่ใช่การยืนยันว่ามีคำสั่งซื้อหรือความต้องการจัดซื้อ</small></div><div class="detail-label">เหตุการณ์ที่เกี่ยวข้อง · Timeline</div><div class="signal-highlight"><div style="display:flex;gap:11px;align-items:flex-start"><span style="font-size:20px;color:#596eec">◉</span><div><strong style="font-size:12px">${esc(f.signal==='ปกติ'?'ยังไม่มีสัญญาณใหม่':f.signal)} — เหตุการณ์จำลอง</strong><p>อัปเดตตัวอย่าง: ${esc(f.updated)}</p><small>ต้องเชื่อมหลักฐานจาก DIW และตรวจสอบวันที่จริงในระบบ Production</small></div></div></div><div class="detail-label">Data provenance & quality</div><div class="source-card"><span class="source-icon">${icon('shield',18)}</span><div><strong>Source transparency</strong><p>ในระบบจริงจะมี URL แหล่งข้อมูล, วันที่ดึงข้อมูล, License, และวันที่ตรวจสอบล่าสุด</p><span class="source-placeholder">DEMO RECORD · NO REAL SOURCE</span></div></div><div class="detail-label">Sales workspace</div><div class="sales-workspace"><label>สถานะการติดตาม</label><select class="selector" data-drawerstatus="${f.id}">${['ยังไม่ติดต่อ','กำลังติดตาม','ติดต่อแล้ว'].map(x=>`<option ${state.leadStatus[f.id]===x?'selected':''}>${x}</option>`).join('')}</select><small>ข้อมูลสถานะจะหายเมื่อโหลดต้นแบบใหม่</small></div><div class="detail-actions"><button class="btn btn-primary" data-save="${f.id}">${icon('star',16)} ${state.saved.has(f.id)?'นำออกจาก Saved Leads':'บันทึกลง Saved Leads'}</button><button class="btn btn-ghost" data-action="close-detail">ปิด</button></div></div>`;el.classList.add('open');document.body.style.overflow='hidden'}
function closeDetail(){state.detail=null;document.getElementById('drawerbg').classList.remove('show');document.getElementById('detail').classList.remove('open');document.body.style.overflow=''}
function csv(){let rows=getFiltered();let s=['Company,Province,Area,Industry,Signal,Demo'].concat(rows.map(f=>[f.name,f.province,f.area,f.type,f.signal,'SIMULATED'].map(x=>'"'+String(x).replaceAll('"','""')+'"').join(','))).join('\r\n');let blob=new Blob(['\ufeff'+s],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='factorylead_demo_only.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('ส่งออก CSV ข้อมูลจำลองเรียบร้อย')}
document.addEventListener('click',ev=>{
 const p=ev.target.closest('[data-page]');if(p){setPage(p.dataset.page);return}
 const s=ev.target.closest('[data-save]');if(s){let id=+s.dataset.save;if(state.saved.has(id))state.saved.delete(id);else{state.saved.add(id);state.leadStatus[id]=state.leadStatus[id]||'ยังไม่ติดต่อ'}let hadDetail=state.detail;render();if(hadDetail)showDetail(id);toast(state.saved.has(id)?'บันทึกโรงงานเข้ารายการแล้ว':'นำโรงงานออกจากรายการแล้ว');return}
 const d=ev.target.closest('[data-detail]');if(d){showDetail(+d.dataset.detail);return}
 const fl=ev.target.closest('[data-filter]');if(fl){state.filter=fl.dataset.filter;state.selected.clear();render();return}
 const vw=ev.target.closest('[data-view]');if(vw){state.view=vw.dataset.view;render();return}
 const cl=ev.target.closest('[data-clear]');if(cl){if(cl.dataset.clear==='province')state.province='ทั้งหมด';if(cl.dataset.clear==='type')state.type='ทั้งหมด';if(cl.dataset.clear==='process')state.process='ทั้งหมด';if(cl.dataset.clear==='filter')state.filter='ทั้งหมด';state.selected.clear();render();return}
 const ld=ev.target.closest('[data-loadsearch]');if(ld){let x=state.savedSearches[+ld.dataset.loadsearch];if(x){Object.assign(state,{q:x.q,province:x.province,type:x.type,process:x.process||'ทั้งหมด',filter:x.filter});state.selected.clear();render();toast('โหลดตัวกรองที่บันทึกไว้แล้ว')}return}
 const de=ev.target.closest('[data-deletesearch]');if(de){state.savedSearches.splice(+de.dataset.deletesearch,1);render();return}
 const a=ev.target.closest('[data-action]');if(a){switch(a.dataset.action){case 'columns':state.columnsOpen=!state.columnsOpen;render();break;case 'toggle-menu':state.menu=!state.menu;render();break;case 'close-menu':state.menu=false;render();break;case 'close-detail':closeDetail();break;case 'toggle-filter':state.filterOpen=!state.filterOpen;render();break;case 'reset-filters':state.q='';state.filter='ทั้งหมด';state.province='ทั้งหมด';state.type='ทั้งหมด';state.process='ทั้งหมด';state.selected.clear();render();break;case 'export':csv();break;case 'bulk-save':state.selected.forEach(id=>{state.saved.add(id);state.leadStatus[id]=state.leadStatus[id]||'ยังไม่ติดต่อ'});state.selected.clear();render();toast('บันทึกรายการที่เลือกแล้ว');break;case 'clear-selection':state.selected.clear();render();break;case 'save-search':document.getElementById('saveSearchModal').classList.add('show');document.getElementById('savedSearchName').focus();break;case 'close-save-modal':document.getElementById('saveSearchModal').classList.remove('show');break;case 'confirm-save-search':let name=document.getElementById('savedSearchName').value.trim();if(!name){toast('กรุณาตั้งชื่อการค้นหาก่อน');break}state.savedSearches.push({name,q:state.q,province:state.province,type:state.type,process:state.process,filter:state.filter});document.getElementById('saveSearchModal').classList.remove('show');document.getElementById('savedSearchName').value='';render();toast('บันทึกตัวกรองในเดโม่แล้ว');break;case 'pricing-demo':toast('ต้นแบบ UX/UI ยังไม่มีการรับชำระเงินจริง');break;case 'notify-demo':toast('ตัวอย่างการแจ้งเตือน ยังไม่เชื่อมข้อมูลจริง');break}}
});
document.addEventListener('input',ev=>{if(ev.target.id==='searchInput'){let pos=ev.target.selectionStart;state.q=ev.target.value;state.selected.clear();render();let input=document.getElementById('searchInput');if(input){input.focus();input.setSelectionRange(pos,pos)}}});
document.addEventListener('change',ev=>{if(ev.target.id==='processSelect'){state.process=ev.target.value;state.selected.clear();render()}else if(ev.target.hasAttribute('data-column')){if(ev.target.dataset.column==='score')state.showScore=ev.target.checked;else state.showSignal=ev.target.checked;render()}else if(ev.target.id==='provinceSelect'){state.province=ev.target.value;state.selected.clear();render()}else if(ev.target.id==='typeSelect'){state.type=ev.target.value;state.selected.clear();render()}else if(ev.target.id==='sortSelect'){state.sort=ev.target.value;render()}else if(ev.target.id==='selectAll'){let fs=getFiltered();if(ev.target.checked)fs.forEach(f=>state.selected.add(f.id));else fs.forEach(f=>state.selected.delete(f.id));render()}else if(ev.target.hasAttribute('data-select')){let id=+ev.target.dataset.select;if(ev.target.checked)state.selected.add(id);else state.selected.delete(id);render()}else if(ev.target.hasAttribute('data-leadstatus')){state.leadStatus[+ev.target.dataset.leadstatus]=ev.target.value;render();toast('อัปเดตสถานะในเดโม่แล้ว')}else if(ev.target.hasAttribute('data-drawerstatus')){let id=+ev.target.dataset.drawerstatus;state.leadStatus[id]=ev.target.value;toast('บันทึกสถานะในเดโม่แล้ว')}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){document.getElementById('saveSearchModal').classList.remove('show');closeDetail();if(state.menu){state.menu=false;render()}}});
render();
})();
</script></body></html>
